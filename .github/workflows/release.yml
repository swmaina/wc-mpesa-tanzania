name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false

      - name: Build plugin zip
        run: |
          mkdir build
          rsync -av --exclude='build' --exclude='.git' --exclude='tests' --exclude='vendor' --exclude='.github' --exclude='*.md' --exclude='composer.*' --exclude='phpcs.xml' --exclude='phpunit.xml' --exclude='package.json' ./ build/wc-mpesa-tanzania/
          cd build
          zip -r wc-mpesa-tanzania-${{ steps.get_version.outputs.VERSION }}.zip wc-mpesa-tanzania/
          cd ..

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/wc-mpesa-tanzania-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: wc-mpesa-tanzania-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip